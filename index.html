<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MobileStore - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="page">


    <!-- LEFT SIDE -->

    <div class="hero">

        <div class="hero-content">

            <div class="logo">
                📱
            </div>

            <h1>
                MobileStore
            </h1>

            <p>
                Your favourite mobiles,
                all in one place.
            </p>

            <div class="features">

                <div>
                    ✓ Latest Smartphones
                </div>

                <div>
                    ✓ Best Prices
                </div>

                <div>
                    ✓ Easy Shopping
                </div>

            </div>

        </div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="login-area">

        <div class="card">


            <div class="mobile-logo">
                📱
            </div>


            <h2>
                Welcome Back!
            </h2>

            <p class="subtitle">
                Login to your MobileStore account
            </p>


            <!-- LOGIN -->

            <div id="loginBox">


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                >


                <label>
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('loginPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <button
                    class="main-button"
                    onclick="login()"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>


                <p class="switch">

                    Don't have an account?

                    <span onclick="showRegister()">
                        Create Account
                    </span>

                </p>

            </div>


            <!-- REGISTER -->

            <div
                id="registerBox"
                class="hidden"
            >


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                >


                <label>
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create password"
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('registerPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <label>
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                    >

                    <button
                        type="button"
                        class="eye"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁️
                    </button>

                </div>


                <button
                    class="main-button"
                    onclick="register()"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="message"
                ></p>


                <p class="switch">

                    Already have an account?

                    <span onclick="showLogin()">
                        Login
                    </span>

                </p>


            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
