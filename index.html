<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MobileStore Login</title><link rel="stylesheet" href="style.css"></head><body>
<div class="auth-page"><div class="auth-card"><div class="brand">📱 MobileStore</div><h1 id="authTitle">Welcome back</h1><p id="authSubtitle">Login to continue to MobileStore</p>
<section id="loginBox"><form id="loginForm"><label>Email</label><input id="loginEmail" type="email" required placeholder="Enter your email"><label>Password</label><div class="pass"><input id="loginPassword" type="password" required placeholder="Enter your password"><button type="button" onclick="togglePassword('loginPassword',this)">👁</button></div><button class="primary" type="submit">Login</button></form><div id="loginMessage" class="message"></div><p class="switch">Don't have an account? <button type="button" onclick="showRegister()">Create account</button></p></section>
<section id="registerBox" class="hidden"><form id="registerForm"><label>Full Name</label><input id="registerName" required placeholder="Enter your full name"><label>Email</label><input id="registerEmail" type="email" required placeholder="Enter your email"><label>Password</label><div class="pass"><input id="registerPassword" type="password" required placeholder="Minimum 6 characters"><button type="button" onclick="togglePassword('registerPassword',this)">👁</button></div><label>Confirm Password</label><div class="pass"><input id="confirmPassword" type="password" required placeholder="Repeat password"><button type="button" onclick="togglePassword('confirmPassword',this)">👁</button></div><button class="primary" type="submit">Create Account</button></form><div id="registerMessage" class="message"></div><p class="switch">Already have an account? <button type="button" onclick="showLogin()">Login</button></p></section></div></div>
<script type="module" src="script.js"></script></body></html>
