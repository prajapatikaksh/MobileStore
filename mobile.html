<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mobile Store</title>

    <link
        rel="stylesheet"
        href="mobile.css"
    >

</head>


<body>


<!-- HEADER -->

<header>

    <h2>
        📱 Mobile Store
    </h2>


    <div>

        <span id="welcomeUser">
            Welcome
        </span>

        <button
            onclick="logout()"
            class="logout"
        >
            Logout
        </button>

    </div>

</header>



<!-- SEARCH -->

<div class="top">

    <input
        type="text"
        id="search"
        placeholder="Search mobile..."
        onkeyup="showProducts()"
    >

</div>



<!-- PRODUCTS -->

<main>

    <h1>
        Latest Mobiles
    </h1>

    <div
        id="products"
        class="products"
    ></div>

</main>



<script src="mobile.js"></script>

</body>

</html>
