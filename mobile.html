<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MobileStore - Mobiles</title>

    <link
        rel="stylesheet"
        href="mobile.css"
    >

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        📱 MobileStore
    </div>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search mobile..."
        >

        <button onclick="searchMobiles()">
            🔍
        </button>

    </div>


    <!-- CART BUTTON -->

    <button
        class="cart-button"
        onclick="openCart()"
    >

        🛒 Cart

        <span id="cartCount">
            0
        </span>

    </button>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Find Your Perfect Smartphone
    </h1>

    <p>
        Choose your favourite mobile company
    </p>

</section>



<!-- =========================
     COMPANY BUTTONS
========================= -->

<div class="companies">

    <button onclick="filterCompany('All')">
        All
    </button>

    <button onclick="filterCompany('Apple')">
        Apple
    </button>

    <button onclick="filterCompany('Samsung')">
        Samsung
    </button>

    <button onclick="filterCompany('OnePlus')">
        OnePlus
    </button>

    <button onclick="filterCompany('Vivo')">
        Vivo
    </button>

    <button onclick="filterCompany('Oppo')">
        Oppo
    </button>

    <button onclick="filterCompany('Realme')">
        Realme
    </button>

    <button onclick="filterCompany('Xiaomi')">
        Xiaomi
    </button>

    <button onclick="filterCompany('Motorola')">
        Motorola
    </button>

    <button onclick="filterCompany('Google')">
        Google
    </button>

    <button onclick="filterCompany('Nothing')">
        Nothing
    </button>

</div>



<!-- =========================
     TITLE
========================= -->

<h2
    class="section-title"
    id="companyTitle"
>
    All Mobiles
</h2>



<!-- =========================
     MOBILE PRODUCTS
========================= -->

<div
    class="mobile-container"
    id="mobileContainer"
></div>



<!-- =========================
     PRODUCT DETAILS MODAL
========================= -->

<div
    class="modal"
    id="productModal"
>

    <div class="modal-content">


        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>


        <img
            id="modalImage"
            src=""
            alt="Mobile"
        >


        <h2 id="modalName"></h2>


        <p
            id="modalCompany"
            class="modal-company"
        ></p>


        <div class="details">

            <p id="modalRam"></p>

            <p id="modalStorage"></p>

            <p id="modalCamera"></p>

            <p id="modalNetwork"></p>

        </div>


        <h3
            id="modalPrice"
            class="modal-price"
        ></h3>


        <button
            class="buy-button"
            onclick="buyMobile()"
        >
            🛒 Buy Now
        </button>


        <button
            class="modal-cart-button"
            onclick="addModalToCart()"
        >
            ➕ Add to Cart
        </button>


    </div>

</div>



<!-- =========================
     CART MODAL
========================= -->

<div
    class="modal"
    id="cartModal"
>

    <div class="cart-content">


        <button
            class="close"
            onclick="closeCart()"
        >
            ×
        </button>


        <h2>
            🛒 Your Cart
        </h2>


        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <div class="cart-bottom">

            <h3>
                Total:
                <span id="cartTotal">
                    ₹0
                </span>
            </h3>


            <button
                class="checkout-button"
                onclick="checkout()"
            >
                🛍️ Checkout
            </button>

        </div>


    </div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 MobileStore | All Rights Reserved
    </p>

    <p class="developer">
        BY PRAJAPATI KAKSH
    </p>

</footer>



<!-- JAVASCRIPT -->

<script src="mobile.js"></script>

</body>

</html>
